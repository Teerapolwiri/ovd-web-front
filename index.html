<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Overdoze Craft Coffee | Staff Portal</title>
    <meta name="description"
        content="Overdoze Craft Coffee — Part-time staff clock-in management portal. Register, clock in/out, and manage your shifts." />
    <script src="https://cdn.tailwindcss.com?/*plugins=forms,*/container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Inter:wght@100..900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A365D",             /* น้ำเงินคราฟต์เข้ม (Apple-like) */
                        "primary-dim": "#102A43",         /* น้ำเงินลึก */
                        "primary-container": "#E2E8F0",   /* เทาอมฟ้าสว่าง (สำหรับพื้นหลังไอคอน) */
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#1A365D",

                        "background": "#F4F7FA",          /* พื้นหลังเว็บแบบพรีเมียม (ไม่ขาวล้วน) */
                        "on-background": "#1A202C",

                        "surface": "#FFFFFF",             /* พื้นผิวการ์ด */
                        "surface-container-highest": "#E2E8F0",
                        "surface-container-high": "#EDF2F7",
                        "surface-container": "#F7FAFC",
                        "surface-container-low": "#FFFFFF",
                        "surface-container-lowest": "#FFFFFF",

                        "on-surface": "#2D3748",          /* สีตัวอักษรหลัก */
                        "on-surface-variant": "#718096",  /* สีตัวอักษรรอง */
                        "outline": "#CBD5E0",
                        "outline-variant": "#E2E8F0",

                        "error": "#E53E3E",
                        "error-container": "#FED7D7",
                        "on-error-container": "#9B2C2C"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body class="text-on-surface">

    <!-- Toast Container -->
    <div id="toast" class="toast"></div>

    <!-- Decorative Blobs -->
    <div class="bg-blob" style="top:-10%;left:-5%;width:40%;height:40%;background:rgba(209,228,251,0.2);"></div>
    <div class="bg-blob" style="top:60%;right:-10%;width:30%;height:50%;background:rgba(234,241,249,0.3);"></div>

    <!-- App Mount Point -->
    <div id="app"></div>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>

</html>
